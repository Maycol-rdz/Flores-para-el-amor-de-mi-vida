<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores amarillas 💛</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
  body{
    background:linear-gradient(135deg,#fff8b8,#ffd86b,#fff3a0,#ffc857);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:#5a3b00;
  }
  @keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;position:relative;overflow:hidden}
  .card{
    width:min(680px,94vw);text-align:center;padding:42px 26px;
    border:2px solid rgba(255,193,7,.5);border-radius:32px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    box-shadow:0 20px 60px rgba(118,76,0,.2);
    position:relative;z-index:3;
  }
  h1{font-size:clamp(2rem,7vw,4rem);margin:0 0 18px;color:#8a5600;text-shadow:0 3px 12px #fff}
  h2{font-size:clamp(1.6rem,6vw,2.8rem);margin:0 0 28px}
  p{font-size:1.15rem}
  button{
    border:0;border-radius:999px;padding:15px 32px;margin:8px;
    font-size:1.1rem;font-weight:bold;cursor:pointer;
    transition:.25s transform,.25s box-shadow;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
  }
  button:hover{transform:translateY(-4px) scale(1.04)}
  .love{background:linear-gradient(135deg,#ffcf33,#ff9f1c);color:white}
  .yes{background:#ffb703;color:white}.no{background:#fff;color:#b26a00;border:2px solid #ffc107}
  .hidden{display:none!important}
  .hearts,.confetti,.words{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .heart{position:absolute;font-size:25px;animation:float linear forwards;opacity:.7}
  @keyframes float{from{transform:translateY(110vh) rotate(0deg);opacity:0}15%{opacity:.8}to{transform:translateY(-15vh) rotate(360deg);opacity:0}}
  .bouquet{font-size:clamp(7rem,25vw,13rem);line-height:1;animation:bloom 1.2s ease both}
  @keyframes bloom{0%{transform:scale(0) rotate(-15deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .final h1{font-size:clamp(2.8rem,11vw,6rem);color:#d88900}
  .teamo{
    position:absolute;color:rgba(255,153,0,.18);font-weight:bold;font-size:clamp(18px,4vw,34px);
    transform:rotate(var(--r));animation:pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:rotate(var(--r)) scale(1.12);opacity:.32}}
  .conf{position:absolute;width:10px;height:18px;top:-30px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}
  .small{font-size:.95rem;opacity:.75}
</style>
</head>
<body>
<div id="hearts" class="hearts"></div>

<section id="start" class="screen">
  <div class="card">
    <h1>Aquí están tus flores amarillas, mi amor 💛🌻</h1>
    <p>He preparado algo especial para ti...</p>
    <button class="love" onclick="showQuestion()">Te amo 💕</button>
  </div>
</section>

<section id="question" class="screen hidden">
  <div class="card">
    <h2 id="questionText">¿Me amas? 🥺💛</h2>
    <div>
      <button class="yes" onclick="firstYes()">Sí 💖</button>
      <button class="no" id="no1" onclick="firstNo()">No 🙈</button>
    </div>
    <p class="small">Piénsalo bien... 👀</p>
  </div>
</section>

<section id="question2" class="screen hidden">
  <div class="card">
    <h2>¿Pero me amas mucho mucho? 🥹💛</h2>
    <button class="yes" onclick="finale()">Sí, muchísimo 💕</button>
    <button class="no" onclick="backFirst()">No 😳</button>
  </div>
</section>

<section id="final" class="screen hidden final">
  <div id="words" class="words"></div>
  <div id="confetti" class="confetti"></div>
  <div class="card">
    <div class="bouquet">💐🌻🌻🌻💛</div>
    <h1>TE AMO 💛</h1>
    <p style="font-size:1.35rem">Estas flores amarillas son para ti, mi amor 🌻</p>
    <p>Mucho, mucho, muchísimo. ❤️</p>
  </div>
</section>

<script>
const hearts = document.getElementById('hearts');

function makeHeart(){
  const h=document.createElement('div');
  h.className='heart';
  h.textContent=['❤️','💛','💕','💖','🌻'][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+'vw';
  h.style.animationDuration=(5+Math.random()*7)+'s';
  h.style.fontSize=(18+Math.random()*28)+'px';
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),13000);
}
setInterval(makeHeart,420);

function hideAll(){
  ['start','question','question2','final'].forEach(id=>document.getElementById(id).classList.add('hidden'));
}
function showQuestion(){hideAll();document.getElementById('question').classList.remove('hidden')}
function firstNo(){showQuestion()}
function firstYes(){hideAll();document.getElementById('question2').classList.remove('hidden')}
function backFirst(){showQuestion()}

function finale(){
  hideAll();
  document.getElementById('final').classList.remove('hidden');
  makeWords();
  makeConfetti();
}
function makeWords(){
  const box=document.getElementById('words');
  for(let i=0;i<55;i++){
    const s=document.createElement('span');
    s.className='teamo';
    s.textContent='TE AMO 💛';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.setProperty('--r',(Math.random()*70-35)+'deg');
    s.style.animationDelay=Math.random()*2+'s';
    box.appendChild(s);
  }
}
function makeConfetti(){
  const box=document.getElementById('confetti');
  for(let i=0;i<180;i++){
    const c=document.createElement('i');
    c.className='conf';
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2.5+Math.random()*4)+'s';
    c.style.animationDelay=Math.random()*2+'s';
    c.style.background=['#ffd166','#ffb703','#fff','#ff6b9a','#f7c948'][Math.floor(Math.random()*5)];
    c.style.transform='rotate('+Math.random()*360+'deg)';
    box.appendChild(c);
  }
}
</script>
</body>
</html>
